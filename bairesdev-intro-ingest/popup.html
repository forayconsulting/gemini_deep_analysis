<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BairesDev Intro Ingest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>BairesDev Intro Ingest</h1>
    <p class="description">Click the button below to scrape all visible intros from the current page and send them to n8n for processing.</p>

    <button id="ingestButton" class="primary-button">
      Ingest Intros
    </button>

    <div id="status" class="status hidden"></div>

    <div id="progress" class="progress hidden">
      <div class="progress-text">
        <span id="progressText">Processing...</span>
      </div>
      <div class="progress-bar">
        <div id="progressBar" class="progress-fill"></div>
      </div>
    </div>

    <div id="results" class="results hidden">
      <h3>Results</h3>
      <p id="resultsText"></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
